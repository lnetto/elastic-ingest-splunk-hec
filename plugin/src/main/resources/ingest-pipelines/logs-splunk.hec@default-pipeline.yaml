version: ${splunk_hec.template.version}
_meta:
  description: Default pipeline of the ingest-splunk-hec plugin's data streams (logs-splunk.hec-*), installed by the plugin
  managed: true
description: >-
  Default pipeline of logs-splunk.hec-* (index.default_pipeline in logs-splunk.hec@settings). Managed by the ingest-splunk-hec plugin,
  which replaces it on upgrade: put your processors in the logs-splunk.hec@custom pipeline, which this one calls.
processors:
  - set:
      description: If '@timestamp' is missing, set it with the ingest timestamp (as logs@default-pipeline does)
      field: "@timestamp"
      copy_from: _ingest.timestamp
      override: false
  - pipeline:
      description: Fleet's hook for every integration's data; doesn't exist unless you create it
      name: global@custom
      ignore_missing_pipeline: true
  - pipeline:
      description: Your processors for every logs-*-* data stream (what Elasticsearch's logs@default-pipeline calls); doesn't exist unless you create it
      name: logs@custom
      ignore_missing_pipeline: true
  - pipeline:
      description: Your processors for these streams; the plugin never creates or changes this pipeline
      name: logs-splunk.hec@custom
      ignore_missing_pipeline: true
